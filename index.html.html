<script>
dash.calc('mir_rank', {
  title: 'Culex MIR rank by season',
  description: 'Each season ranked by Culex MIR, highest first, out of all seasons on record.',
  inputs: ['seasons'],
  fn: (seasons) => {
    const yrs = seasons.filter((s) => s.year !== 'all');
    const sorted = [...yrs].sort((a, b) => Number(b.culex_mir) - Number(a.culex_mir));
    return yrs.map((s) => ({ year: String(s.year), rank: sorted.findIndex((x) => x.year === s.year) + 1, seasons: yrs.length }));
  },
});
dash.calc('weather_mir', {
  title: 'Summer weather with Culex MIR',
  description: 'NWS summer weather for Saginaw joined to each season’s WNV-positive pools and Culex MIR by year.',
  inputs: ['weather', 'seasons'],
  fn: (weather, seasons) => weather.map((w) => {
    const s = seasons.find((x) => String(x.year) === String(w.year)) || {};
    return { year: String(w.year), avg_temp_f: w.avg_temp_f, temp_dep_f: w.temp_dep_f, rain_in: w.rain_in, rain_dep_in: w.rain_dep_in, wnv_pos: s.wnv_pos ?? null, culex_mir: s.culex_mir ?? null };
  }),
});
dash.calc('early_warning', {
  title: 'First positive bird vs first positive pool',
  description: 'For each season from 2016 with both, the date of the first WNV-positive dead bird and of the first WNV-positive pool, and how many days the bird came first.',
  inputs: ['birds_pos', 'seasons'],
  fn: (birds_pos, seasons) => seasons.filter((s) => s.year !== 'all' && Number(s.year) >= 2016).map((s) => {
    const b = birds_pos.filter((x) => x.year === s.year).map((x) => x.date).sort()[0];
    if (!b) return null;
    return { year: s.year, first_bird: b, first_pool: s.first_pos, days_bird_first: Math.round((new Date(s.first_pos) - new Date(b)) / 86400000) };
  }).filter(Boolean),
});
dash.calc('rain_local_mir', {
  title: 'Local gauge rain with Culex MIR',
  description: 'Monthly rain at the 14 light trap gauges (county average) joined to each season’s Culex MIR and WNV-positive pools.',
  inputs: ['rain_local', 'seasons'],
  fn: (rain_local, seasons) => rain_local.map((r) => {
    const s = seasons.find((x) => String(x.year) === r.year) || {};
    return { year: r.year, jun_in: r.jun_in, jul_in: r.jul_in, aug_in: r.aug_in, jun_aug_in: r.jun_aug_in, culex_mir: s.culex_mir ?? null, wnv_pos: s.wnv_pos ?? null };
  }),
});
dash.calc('ncei_mir', {
  title: 'NOAA season rain with Culex MIR',
  description: 'NOAA NCEI Bay County monthly rain joined to each season\u2019s Culex MIR and WNV-positive pools, 2016–2026.',
  inputs: ['rain_ncei', 'seasons'],
  fn: (rain_ncei, seasons) => rain_ncei.filter((r) => Number(r.year) >= 2016).map((r) => {
    const s = seasons.find((x) => String(x.year) === r.year) || {};
    return { year: r.year, may_sep_in: r.may_sep_in, jun_aug_in: r.jun_aug_in, jul_in: r.jul_in, culex_mir: s.culex_mir ?? null, wnv_pos: s.wnv_pos ?? null };
  }),
});
dash.calc('peak_mir', {
  title: 'Peak weekly Culex MIR by season',
  description: 'The highest weekly Culex MIR in each season (weeks with 100+ Culex tested) and the week it happened.',
  inputs: ['weekly'],
  fn: (weekly) => {
    const out = [];
    for (const y of [...new Set(weekly.map((r) => String(r.year)))].filter((y) => y !== 'all').sort()) {
      const rows = weekly.filter((r) => String(r.year) === y && r.mir != null);
      const top = rows.reduce((a, b) => (b.mir > a.mir ? b : a), rows[0]);
      if (top) out.push({ year: y, peak_week: top.week, peak_mir: top.mir, culex_tested: top.culex_tested });
    }
    return out;
  },
});

<script>
(() => {
  const F = {
    int: d3.format(','),
    pct: d3.format('.1%'),
    mir: d3.format('.2f'),
    sgn: (v, f) => (v > 0 ? '+' : v < 0 ? '−' : '±') + f(Math.abs(v)),
    date: (s) => d3.utcFormat('%b %-d')(new Date(s + 'T00:00:00Z')),
    dateY: (s) => d3.utcFormat('%b %-d, %Y')(new Date(s + 'T00:00:00Z')),
  };
  const season = () => String(dash.params().season ?? '2026');
  const isAll = () => season() === 'all';
  const css = (el, name) => getComputedStyle(el).getPropertyValue(name).trim();
  const enc = encodeURIComponent;
  const fail = (el, ...ids) => {
    const bad = ids.some((id) => ['error', 'connect', 'declined'].includes(dash.data(id).status));
    if (bad) { el.replaceChildren(); const d = document.createElement('div'); d.className = 'bw-fail'; d.textContent = 'Failed to load'; el.append(d); }
    return bad;
  };
  const ready = (el, ...ids) => {
    el.replaceChildren();
    if (fail(el, ...ids)) { el.classList.remove('dash-skeleton'); return false; }
    if (ids.some((id) => dash.data(id).status !== 'ok')) { el.classList.add('dash-skeleton'); return false; }
    el.classList.remove('dash-skeleton');
    return true;
  };
  const tip = (el) => { const t = document.createElement('div'); t.className = 'bw-tip'; t.hidden = true; el.append(t); return t; };
  const showTip = (el, t, ev, lines) => {
    t.replaceChildren();
    lines.filter(Boolean).forEach((l, i) => { const d = document.createElement('div'); if (i === 0) d.className = 'h'; d.textContent = l; t.append(d); });
    t.hidden = false;
    const r = el.getBoundingClientRect();
    let x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
    const tw = t.offsetWidth, th = t.offsetHeight;
    if (x + tw > r.width) x = ev.clientX - r.left - tw - 12;
    if (y + th > r.height) y = ev.clientY - r.top - th - 12;
    t.style.left = Math.max(0, x) + 'px'; t.style.top = Math.max(0, y) + 'px';
  };
  const axisClean = (g) => g.attr('font-size', null).attr('font-family', null).call((s) => s.selectAll('text').attr('fill', 'var(--color-fg-muted)').style('font-size', 'var(--cds-font-size-caption)')).call((s) => s.selectAll('line,path').attr('stroke', 'var(--cds-chart-axis)'));
  const textW = (svg, s) => { const t = svg.append('text').style('font-size', 'var(--cds-font-size-caption)').text(s); const w = t.node().getComputedTextLength(); t.remove(); return w; };
  window.bw = { F, season, isAll, css, enc, fail, ready, tip, showTip, axisClean, textW };

  // tabs
  const tabs = ['overview', 'heatmap', 'weekly', 'species', 'traps26', 'history', 'weather', 'tables'];
  const show = (id) => {
    document.querySelectorAll('.bw-page').forEach((s) => { s.hidden = s.id !== id; });
    document.querySelectorAll('.bw-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  };
  document.querySelectorAll('.bw-tabs button').forEach((b) => b.addEventListener('click', () => { show(b.dataset.tab); dash.setLink(b.dataset.tab); }));
  const start = location.hash.slice(1);
  if (tabs.includes(start)) show(start);

  dash.onData(() => {
    const all = isAll();
    document.querySelectorAll('.bw-lede-season').forEach((e) => { e.hidden = all; });
    document.querySelectorAll('.bw-lede-all').forEach((e) => { e.hidden = !all; });
    document.querySelectorAll('.bw-delta').forEach((e) => { e.hidden = all; });
    document.querySelectorAll('.bw-cum-one').forEach((e) => { e.hidden = all; });
    document.querySelectorAll('.bw-cum-all').forEach((e) => { e.hidden = !all; });
  });

  dash.draw('season', (sel) => {
    const g = dash.data('seasons');
    const years = g.status === 'ok' ? g.data.map((r) => String(r.year)).filter((y) => y !== 'all').sort().reverse() : [];
    sel.replaceChildren(new Option('All years', 'all'), ...years.map((y) => new Option(y, y)));
    sel.value = season();
    sel.onchange = () => dash.setParams({ season: sel.value });
  });
  dash.draw('yr', (el) => { el.textContent = isAll() ? 'all years' : season(); });

  const val = (name, field, fmt, ds = 'seasons', fixed) => dash.draw(name, (el) => {
    const g = dash.data(ds);
    const yr = fixed || season();
    el.setAttribute('data-where', 'year=' + enc(yr));
    const row = g.status === 'ok' ? g.data.find((r) => String(r.year) === yr) : null;
    if (!row || row[field] == null) { el.textContent = '—'; return; }
    el.textContent = fmt(row[field]);
  });
  val('lede-pos', 'wnv_pos', F.int); val('lede-pools', 'pools', F.int); val('lede-pct', 'pct_pos', F.pct); val('lede-mir', 'culex_mir', F.mir);
  const ord = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  val('lede-rank', 'rank', (v) => ord(v) + ' highest', 'mir_rank'); val('lede-n', 'seasons', String, 'mir_rank');
  val('all-pos', 'wnv_pos', F.int, 'seasons', 'all'); val('all-pools', 'pools', F.int, 'seasons', 'all'); val('all-pct', 'pct_pos', F.pct, 'seasons', 'all');
  val('all-sites', 'sites_pos', F.int, 'seasons', 'all'); val('all-mir', 'culex_mir', F.mir, 'seasons', 'all');
  val('t-pos', 'wnv_pos', F.int); val('t-mir', 'culex_mir', F.mir); val('t-pools', 'pools', F.int); val('t-mosq', 'mosquitoes', F.int);
  val('t-pct', 'pct_pos', F.pct); val('t-sites', 'sites_pos', F.int); val('t-first', 'first_pos', (v) => (isAll() ? F.dateY(v) : F.date(v)));
  val('t-firstwk', 'first_week', String); val('t-jcv', 'jcv_pos', F.int);
  const delta = (name, field, fmt) => dash.draw(name, (el) => {
    const g = dash.data('seasons');
    el.setAttribute('data-where', 'year=' + enc(season()));
    const row = g.status === 'ok' ? g.data.find((r) => String(r.year) === season()) : null;
    el.classList.remove('up', 'down');
    if (!row || row[field] == null) { el.textContent = '—'; return; }
    const v = Number(row[field]);
    el.textContent = F.sgn(v, fmt);
    if (v > 0) el.classList.add('up'); else if (v < 0) el.classList.add('down');
  });
  delta('t-pos-d', 'pos_delta', F.int); delta('t-mir-d', 'mir_delta', F.mir);
  const arbo = (name, field, fixed) => dash.draw(name, (el) => {
    const g = dash.data('arbo_testing');
    const yr = fixed || season();
    el.setAttribute('data-where', 'year=' + enc(yr));
    const row = g.status === 'ok' ? g.data.find((r) => r.year === yr) : null;
    if (!row) { el.textContent = '\u2014'; return; }
    if (field === 'eee_pos' && row.eee_tested === 0) { el.textContent = 'Not tested'; return; }
    el.textContent = F.int(row[field]);
  });
  arbo('t-eee', 'eee_pos'); arbo('t-eee-n', 'eee_tested');
  dash.draw('eee-table', (tb) => {
    const g = dash.data('eee_positives');
    if (g.status !== 'ok') { tb.replaceChildren(); return; }
    tb.replaceChildren(...g.data.map((r) => {
      const tr = document.createElement('tr');
      [[r.pool_id], [F.dateY(r.date)], [String(r.week), 'hide-sm'], [r.site], [r.township, 'hide-sm'], [r.species], [String(r.number_in_pool), 'hide-sm'], [r.trap, 'hide-sm']]
        .forEach(([v, c]) => { const td = document.createElement('td'); if (c) td.className = c; td.textContent = v; tr.append(td); });
      return tr;
    }));
  });
  arbo('eee-all-n', 'eee_tested', 'all'); arbo('eee-all-m', 'eee_mosquitoes', 'all'); arbo('eee-all-pos', 'eee_pos', 'all');
  dash.draw('arbo-table', (tb) => {
    const g = dash.data('arbo_testing');
    if (g.status !== 'ok') { tb.replaceChildren(); return; }
    const rows = [...g.data].sort((a, b) => (a.year === 'all' ? 1 : b.year === 'all' ? -1 : b.year.localeCompare(a.year)));
    const n = (v, t) => (t === 0 ? '' : F.int(v));
    tb.replaceChildren(...rows.map((r) => {
      const tr = document.createElement('tr'); if (r.year === season()) tr.className = 'sel';
      [[r.year], [r.testing, 'hide-sm'], [F.int(r.pools)], [n(r.wnv_tested, r.wnv_tested)], [n(r.wnv_pos, r.wnv_tested)], [n(r.jcv_tested, r.jcv_tested)], [n(r.jcv_pos, r.jcv_tested)],
        [n(r.eee_tested, r.eee_tested)], [r.eee_tested === 0 ? 'Not tested' : F.int(r.eee_pos)], [n(r.eee_bridge_pools, r.eee_tested), 'hide-sm']]
        .forEach(([v, c]) => { const td = document.createElement('td'); if (c) td.className = c; td.textContent = v; tr.append(td); });
      return tr;
    }));
  });
})();
<\/script>

<script>
(() => {
  const { F, season, isAll, css, ready, tip, showTip, axisClean, textW } = window.bw;

  dash.draw('heat', (el) => {
    if (!ready(el, 'weekly')) return;
    const rows = dash.data('weekly').data.filter((r) => r.year !== 'all');
    const years = [...new Set(rows.map((r) => String(r.year)))].sort();
    const weeks = d3.range(21, 40);
    const totals = d3.rollup(rows, (v) => d3.sum(v, (r) => r.wnv_pos), (r) => String(r.year));
    const W = el.clientWidth;
    const svg = d3.select(el).append('svg').attr('width', '100%');
    const labelW = d3.max(years, (y) => textW(svg, `${y} (${totals.get(y)})`)) + 10;
    const m = { t: 4, r: 4, b: 34, l: labelW };
    const H = m.t + m.b + years.length * 26;
    svg.attr('viewBox', `0 0 ${W} ${H}`).attr('height', H);
    const x = d3.scaleBand(weeks, [m.l, W - m.r]).padding(0.06);
    const y = d3.scaleBand(years, [m.t, H - m.b]).padding(0.08);
    const max = d3.max(rows, (r) => r.wnv_pos) || 1;
    const ramp = d3.scaleLinear([0, 0.25, 0.5, 0.75, 1], ['#ffffb2', '#fecc5c', '#fd8d3c', '#f03b20', '#bd0026']);
    const byKey = new Map(rows.map((r) => [String(r.year) + '|' + r.week, r]));
    const t = tip(el);
    const sel = season();
    svg.append('g').selectAll('rect').data(years.flatMap((yy) => weeks.map((w) => ({ yy, w, r: byKey.get(yy + '|' + w) })))).join('rect')
      .attr('x', (d) => x(d.w)).attr('y', (d) => y(d.yy)).attr('width', x.bandwidth()).attr('height', y.bandwidth()).attr('rx', 2)
      .attr('fill', (d) => (d.r && d.r.wnv_pos > 0 ? ramp(Math.sqrt(d.r.wnv_pos / max)) : 'var(--cds-chart-grid)'))
      .attr('opacity', (d) => (d.r && d.r.wnv_pos > 0 ? 1 : 0.5))
      .on('mousemove', (ev, d) => showTip(el, t, ev, [`${d.yy}, week ${d.w}`, `${d.r ? d.r.wnv_pos : 0} positive of ${d.r ? F.int(d.r.pools) : 0} pools`]))
      .on('mouseleave', () => { t.hidden = true; });
    if (x.bandwidth() >= 16) {
      svg.append('g').attr('pointer-events', 'none').selectAll('text').data(rows.filter((r) => r.wnv_pos > 0 && r.week >= 21 && r.week <= 39)).join('text')
        .attr('x', (r) => x(r.week) + x.bandwidth() / 2).attr('y', (r) => y(String(r.year)) + y.bandwidth() / 2).attr('dy', '0.35em')
        .attr('text-anchor', 'middle').style('font-size', '11px').style('font-variant-numeric', 'tabular-nums')
        .attr('fill', (r) => (Math.sqrt(r.wnv_pos / max) > 0.6 ? '#fff' : '#3b1a00')).text((r) => r.wnv_pos);
    }
    if (years.includes(sel)) svg.append('rect').attr('x', m.l - 2).attr('y', y(sel) - 2).attr('width', W - m.l - m.r + 4).attr('height', y.bandwidth() + 4).attr('fill', 'none').attr('stroke', 'var(--color-fg)').attr('stroke-width', 1.5).attr('rx', 3);
    svg.append('g').selectAll('text').data(years).join('text').attr('x', m.l - 8).attr('y', (yy) => y(yy) + y.bandwidth() / 2).attr('dy', '0.35em').attr('text-anchor', 'end')
      .style('font-size', 'var(--cds-font-size-caption)').style('font-weight', (yy) => (yy === sel ? 600 : 400)).attr('fill', (yy) => (yy === sel ? 'var(--color-fg)' : 'var(--color-fg-muted)')).text((yy) => `${yy} (${totals.get(yy)})`);
    const step = x.bandwidth() < 20 ? 2 : 1;
    svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(weeks.filter((w, i) => i % step === 0)).tickSize(0).tickPadding(6)).call(axisClean).call((s) => s.select('.domain').remove());
    svg.append('text').attr('x', (m.l + W - m.r) / 2).attr('y', H - 4).attr('text-anchor', 'middle').attr('fill', 'var(--color-fg-muted)').style('font-size', 'var(--cds-font-size-caption)').text('Week (Sunday–Saturday)');
  });

  dash.draw('cum', (el) => {
    if (!ready(el, 'weekly')) return;
    const sel = season();
    const rows = dash.data('weekly').data.filter((r) => r.year !== 'all');
    const series = d3.groups(rows, (r) => String(r.year)).map(([k, v]) => ({ k, v: v.sort((a, b) => a.week - b.week) }));
    const W = el.clientWidth, H = 300;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('height', H);
    const y = d3.scaleLinear([0, d3.max(rows, (r) => r.cum_pos) || 1], [H - 28, 10]).nice();
    const cur = series.find((s) => s.k === sel);
    const endLabel = cur ? `${sel}: ${F.int(cur.v.at(-1).cum_pos)}` : '';
    const all = isAll();
    const PAL = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#17becf', '#bcbd22', '#7f7f7f', '#393b79'];
    const yc = (k) => PAL[series.findIndex((s) => s.k === k) % PAL.length];
    const m = { t: 10, r: (all ? d3.max(series, (s) => textW(svg, `${s.k} (${s.v.at(-1).cum_pos})`)) : endLabel ? textW(svg, endLabel) : 0) + 12, b: 28, l: d3.max(y.ticks(5), (v) => textW(svg, F.int(v))) + 10 };
    const x = d3.scaleLinear([20, 40], [m.l, W - m.r]);
    svg.append('g').selectAll('line').data(y.ticks(5)).join('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y).attr('y2', y).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(0).tickPadding(6).tickFormat(F.int)).call(axisClean).call((s) => s.select('.domain').remove());
    svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(Math.min(10, Math.floor((W - m.l - m.r) / 44))).tickFormat((d) => 'Wk ' + d)).call(axisClean);
    const line = d3.line().x((r) => x(r.week)).y((r) => y(r.cum_pos));
    const ordered = [...series.filter((s) => s.k !== sel), ...series.filter((s) => s.k === sel)];
    svg.append('g').selectAll('path').data(ordered).join('path').attr('d', (s) => line(s.v)).attr('fill', 'none')
      .attr('stroke', (s) => (all ? yc(s.k) : s.k === sel ? dash.colors[0] : 'var(--cds-chart-muted)')).attr('stroke-width', (s) => (all ? 2 : s.k === sel ? 2.5 : 1.2)).attr('opacity', (s) => (all || s.k === sel ? 1 : 0.7))
      .attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    if (all) {
      const ends = series.map((s) => ({ k: s.k, n: s.v.at(-1).cum_pos, x: x(s.v.at(-1).week), y: y(s.v.at(-1).cum_pos) })).sort((a, b) => b.y - a.y);
      for (let i = 1; i < ends.length; i++) if (ends[i - 1].y - ends[i].y < 12) ends[i].y = ends[i - 1].y - 12;
      svg.append('g').selectAll('text').data(ends).join('text').attr('x', (d) => d.x + 6).attr('y', (d) => d.y).attr('dy', '0.35em')
        .style('font-size', 'var(--cds-font-size-caption)').style('font-weight', 600).attr('fill', (d) => yc(d.k)).text((d) => `${d.k} (${d.n})`);
    }
    if (cur) svg.append('text').attr('x', x(cur.v.at(-1).week) + 6).attr('y', y(cur.v.at(-1).cum_pos)).attr('dy', '0.35em').attr('fill', dash.colors[0]).style('font-size', 'var(--cds-font-size-caption)').style('font-weight', 600).text(endLabel);
    const t = tip(el);
    svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).attr('fill', 'transparent')
      .on('mousemove', (ev) => {
        const wk = Math.round(x.invert(d3.pointer(ev)[0]));
        const vals = series.map((s) => [s.k, s.v.find((v) => v.week === wk)?.cum_pos ?? 0]).sort((a, b) => b[1] - a[1] || b[0].localeCompare(a[0]));
        showTip(el, t, ev, [`Week ${wk}`, ...vals.slice(0, 11).map(([k, v]) => `${k}: ${v}`)]);
      })
      .on('mouseleave', () => { t.hidden = true; });
  });

  dash.draw('wmir', (el) => {
    if (!ready(el, 'weekly')) return;
    const sel = season();
    const rows = dash.data('weekly').data.filter((r) => String(r.year) === sel).sort((a, b) => a.week - b.week);
    const W = el.clientWidth, H = 300;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('height', H);
    const yb = d3.scaleLinear([0, Math.max(4, d3.max(rows, (r) => r.wnv_pos) || 0)], [H - 28, 18]).nice();
    const ym = d3.scaleLinear([0, Math.max(5, d3.max(rows, (r) => r.mir ?? 0) || 0)], [H - 28, 18]).nice();
    const m = { t: 18, r: d3.max(ym.ticks(4), (v) => textW(svg, F.mir(v))) + 10, b: 28, l: d3.max(yb.ticks(4), (v) => textW(svg, F.int(v))) + 10 };
    const x = d3.scaleBand(rows.map((r) => r.week), [m.l, W - m.r]).padding(0.25);
    svg.append('g').selectAll('line').data(yb.ticks(4)).join('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', yb).attr('y2', yb).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(yb).ticks(4).tickSize(0).tickPadding(6).tickFormat(F.int)).call(axisClean).call((s) => s.select('.domain').remove());
    svg.append('g').attr('transform', `translate(${W - m.r},0)`).call(d3.axisRight(ym).ticks(4).tickSize(0).tickPadding(6).tickFormat(F.mir)).call(axisClean).call((s) => s.select('.domain').remove()).call((s) => s.selectAll('text').attr('fill', dash.colors[1]));

<script>
(() => {
  const { F, season, isAll, ready, tip, showTip } = window.bw;
  const COUNTY = [-84.18, -83.685, 43.47, 44.005];
  const ZOOM = [-84.08, -83.72, 43.525, 43.70]; // fixed view box around the Bay City cluster
  const RAMP = ['#ffffb2', '#fecc5c', '#fd8d3c', '#f03b20', '#bd0026'];
  const YEARS = d3.range(2016, 2027).map(String);
  const yearColor = d3.scaleLinear(d3.range(0, 1.0001, 0.25).map((v) => 2016 + v * 10), ['#9ecae1', '#41b6c4', '#fecc44', '#f46d43', '#a50026']);
  window.bwYearColor = yearColor;

  const ringPath = (rows, px, py) => {
    const parts = d3.groups(rows, (r) => r.name + '|' + r.part);
    return parts.map(([k, pts]) => ({ k, name: pts[0].name, kind: pts[0].kind, lx: pts[0].label_lon, ly: pts[0].label_lat,
      d: 'M' + pts.sort((a, b) => a.i - b.i).map((p) => px(p.lon).toFixed(1) + ',' + py(p.lat).toFixed(1)).join('L') + 'Z' }));
  };
  const geoToPath = (geom) => geom.coordinates.map((poly) => poly.map((ring) => 'M' + ring.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z').join('')).join('');

  // draws one map; opts: {box, pos (positive pool rows), ghost (earlier positives), colorBy: 'heat'|'year', showZoomBox}
  const drawMap = (el, opts) => {
    const k = Math.cos((43.7 * Math.PI) / 180);
    const [lon0, lon1, lat0, lat1] = opts.box;
    const W = el.clientWidth;
    const spanX = (lon1 - lon0) * k, spanY = lat1 - lat0;
    const H = Math.round(Math.max(420, Math.min(720, (W * spanY) / spanX)));
    const s = Math.min(W / spanX, H / spanY);
    const ox = (W - spanX * s) / 2, oy = (H - spanY * s) / 2;
    const px = (lon) => ox + (lon - lon0) * k * s, py = (lat) => oy + (lat1 - lat) * s;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('height', H);
    const clipId = 'clip-' + Math.random().toString(36).slice(2);
    svg.append('clipPath').attr('id', clipId).append('rect').attr('width', W).attr('height', H);
    const root = svg.append('g').attr('clip-path', `url(#${clipId})`);
    // water/background
    root.append('rect').attr('width', W).attr('height', H).attr('fill', 'color-mix(in srgb, #4a90c2 10%, var(--color-panel))');
    const twp = ringPath(dash.data('townships_geo').data, px, py);
    const county = ringPath(dash.data('county_geo').data, px, py);
    root.append('g').selectAll('path').data(county).join('path').attr('d', (d) => d.d).attr('fill', 'var(--color-bg)');
    root.append('g').selectAll('path').data(twp).join('path').attr('d', (d) => d.d)
      .attr('fill', (d) => (d.kind === 'city' ? 'color-mix(in srgb, var(--color-fg) 5%, transparent)' : 'none'))
      .attr('stroke', 'var(--color-fg-muted)').attr('stroke-opacity', 0.55).attr('stroke-width', 0.8);
    // heat
    const pos = opts.pos;
    if (pos.length && d3.contourDensity) {
      const bw = Math.max(8, 0.02 * s);
      const dens = d3.contourDensity().x((r) => px(r.lon)).y((r) => py(r.lat)).size([W, H]).bandwidth(bw).thresholds(14)(pos);
      const vmax = d3.max(dens, (c) => c.value) || 1;
      const col = d3.scaleLinear(d3.range(5).map((i) => (i / 4) * vmax), RAMP);
      root.append('g').attr('pointer-events', 'none').selectAll('path').data(dens.slice(1)).join('path')
        .attr('d', geoToPath).attr('fill', (c) => col(c.value)).attr('fill-opacity', 0.55).attr('stroke', 'none');
    }
    root.append('g').selectAll('path').data(county).join('path').attr('d', (d) => d.d).attr('fill', 'none').attr('stroke', 'var(--color-fg)').attr('stroke-width', 1.6);
    // labels
    const seen = new Set();
    const rank = (d) => (d.name === 'Bay City' ? 0 : d.kind === 'township' ? 1 : 2);
    const labels = twp.filter((d) => { if (seen.has(d.name)) return false; seen.add(d.name); return true; })
      .filter((d) => d.lx >= lon0 && d.lx <= lon1 && d.ly >= lat0 && d.ly <= lat1).sort((a, b) => rank(a) - rank(b));
    root.append('g').attr('pointer-events', 'none').selectAll('text').data(labels).join('text')
      .attr('x', (d) => px(d.lx)).attr('y', (d) => py(d.ly)).attr('text-anchor', 'middle').attr('dy', '0.35em')
      .style('font-size', (d) => (d.kind === 'city' ? '10px' : '11px')).style('font-weight', 500).style('letter-spacing', '0.02em')
      .attr('fill', 'var(--color-fg-muted)').attr('stroke', 'var(--color-bg)').attr('stroke-width', 3).attr('paint-order', 'stroke').text((d) => d.name)
      .each(function () { const b = this.getBBox(); if (b.x < 2 || b.x + b.width > W - 2 || b.y < 2 || b.y + b.height > H - 2) this.remove(); });
    { const kept = []; root.selectAll('text').each(function () { if (!this.isConnected) return; const b = this.getBBox(); if (kept.some((k) => b.x < k.x + k.width + 2 && k.x < b.x + b.width + 2 && b.y < k.y + k.height && k.y < b.y + b.height)) this.remove(); else kept.push(b); }); }
    // trap sites
    const t = tip(el);
    const posSites = new Set(pos.map((r) => r.site));
    root.append('g').selectAll('circle').data(dash.data('sites').data.filter((r) => r.lat != null && !posSites.has(r.site))).join('circle')
      .attr('cx', (r) => px(r.lon)).attr('cy', (r) => py(r.lat)).attr('r', 2).attr('fill', 'var(--cds-chart-muted)').attr('opacity', 0.75)
      .on('mousemove', (ev, r) => showTip(el, t, ev, [r.site, `${r.township} · ${F.int(r.pools)} pools, ${r.years_trapped} seasons trapped`, r.wnv_pos ? `${r.wnv_pos} positive pools in other seasons/weeks` : 'Never WNV-positive']))
      .on('mouseleave', () => { t.hidden = true; });
    if (opts.ghost && opts.ghost.length) {
      root.append('g').attr('pointer-events', 'none').selectAll('circle').data(opts.ghost).join('circle')
        .attr('cx', (r) => px(r.lon)).attr('cy', (r) => py(r.lat)).attr('r', 4.5).attr('fill', 'none').attr('stroke', '#7a0177').attr('stroke-width', 1.4).attr('opacity', 0.75);
    }
    // positives
    const r0 = opts.box === ZOOM ? 1.6 : 1;
    if (opts.colorBy === 'year') {
      const jit = (r, i) => { const a = (i * 2.399) % (2 * Math.PI), d = i === 0 ? 0 : 4 * Math.sqrt(i); return [Math.cos(a) * d, Math.sin(a) * d]; };
      const grouped = d3.groups(pos, (r) => r.site).flatMap(([, rs]) => rs.sort((a, b) => a.year.localeCompare(b.year)).map((r, i) => ({ r, o: jit(r, i) })));
      root.append('g').selectAll('circle').data(grouped).join('circle')
        .attr('cx', (d) => px(d.r.lon) + d.o[0]).attr('cy', (d) => py(d.r.lat) + d.o[1]).attr('r', 5 * r0)
        .attr('fill', (d) => yearColor(Number(d.r.year))).attr('stroke', 'var(--color-fg)').attr('stroke-width', 0.8)
        .on('mousemove', (ev, d) => showTip(el, t, ev, [d.r.site, `${d.r.township} · ${F.dateY(d.r.date)} (week ${d.r.week})`, `${d.r.species}, ${d.r.trap} trap`]))
        .on('mouseleave', () => { t.hidden = true; });
    } else {
      const bySite = d3.groups(pos, (r) => r.site).map(([site, rs]) => ({ site, rs, n: rs.length, lat: rs.at(-1).lat, lon: rs.at(-1).lon }));
      const rs = d3.scaleSqrt([0, d3.max(bySite, (d) => d.n) || 1], [0, 14 * r0]);
      root.append('g').selectAll('circle').data(bySite.sort((a, b) => b.n - a.n)).join('circle')
        .attr('cx', (d) => px(d.lon)).attr('cy', (d) => py(d.lat)).attr('r', (d) => Math.max(3.5 * r0, rs(d.n)))
        .attr('fill', '#bd0026').attr('fill-opacity', 0.85).attr('stroke', '#fff').attr('stroke-width', 1.2)
        .on('mousemove', (ev, d) => {
          const yrs = d3.rollups(d.rs, (v) => v.length, (r) => r.year).sort().map(([y, n]) => `${y}: ${n}`).join(' · ');
          showTip(el, t, ev, [d.site, `${d.rs[0].township} · ${d.n} positive pool${d.n === 1 ? '' : 's'}`, yrs, `Weeks ${d3.min(d.rs, (r) => r.week)}–${d3.max(d.rs, (r) => r.week)}`]);
        })
        .on('mouseleave', () => { t.hidden = true; });
    }
    if (opts.showZoomBox) {
      root.append('rect').attr('x', px(ZOOM[0])).attr('y', py(ZOOM[3])).attr('width', px(ZOOM[1]) - px(ZOOM[0])).attr('height', py(ZOOM[2]) - py(ZOOM[3]))
        .attr('fill', 'none').attr('stroke', 'var(--color-fg)').attr('stroke-dasharray', '5 4').attr('stroke-width', 1.2).attr('pointer-events', 'none');
    }
    el.append(t);
  };
  const IDS = ['positives', 'sites', 'townships_geo', 'county_geo'];
  const selPos = () => { const sel = season(); return dash.data('positives').data.filter((r) => isAll() || r.year === sel); };
  dash.draw('map-county', (el) => { if (!ready(el, ...IDS)) return; drawMap(el, { box: COUNTY, pos: selPos(), colorBy: 'heat', showZoomBox: true }); });
  dash.draw('map-zoom', (el) => { if (!ready(el, ...IDS)) return; drawMap(el, { box: ZOOM, pos: selPos(), colorBy: 'heat' }); });

  // positive dead birds map
  dash.draw('bird-map', (el) => {
    if (!ready(el, 'birds_pos', 'townships_geo', 'county_geo')) return;
    const k = Math.cos((43.7 * Math.PI) / 180);
    const [lon0, lon1, lat0, lat1] = COUNTY;
    const W = el.clientWidth;
    const spanX = (lon1 - lon0) * k, spanY = lat1 - lat0;
    const H = Math.round(Math.max(420, Math.min(680, (W * spanY) / spanX)));
    const sc = Math.min(W / spanX, H / spanY);
    const ox = (W - spanX * sc) / 2, oy = (H - spanY * sc) / 2;
    const px = (lon) => ox + (lon - lon0) * k * sc, py = (lat) => oy + (lat1 - lat) * sc;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('height', H);
    svg.append('rect').attr('width', W).attr('height', H).attr('fill', 'color-mix(in srgb, #4a90c2 10%, var(--color-panel))');
    const twp = ringPath(dash.data('townships_geo').data, px, py), county = ringPath(dash.data('county_geo').data, px, py);
    svg.append('g').selectAll('path').data(county).join('path').attr('d', (d) => d.d).attr('fill', 'var(--color-bg)');
    svg.append('g').selectAll('path').data(twp).join('path').attr('d', (d) => d.d).attr('fill', 'none').attr('stroke', 'var(--color-fg-muted)').attr('stroke-opacity', 0.55).attr('stroke-width', 0.8);
    svg.append('g').selectAll('path').data(county).join('path').attr('d', (d) => d.d).attr('fill', 'none').attr('stroke', 'var(--color-fg)').attr('stroke-width', 1.6);
    const seen = new Set();
    svg.append('g').attr('pointer-events', 'none').selectAll('text').data(twp.filter((d) => d.kind === 'township' || d.name === 'Bay City').filter((d) => (seen.has(d.name) ? false : seen.add(d.name)))).join('text')
      .attr('x', (d) => px(d.lx)).attr('y', (d) => py(d.ly)).attr('text-anchor', 'middle').attr('dy', '0.35em').style('font-size', '11px')
      .attr('fill', 'var(--color-fg-muted)').attr('stroke', 'var(--color-bg)').attr('stroke-width', 3).attr('paint-order', 'stroke').text((d) => d.name);
    const sel = season();
    const rows = dash.data('birds_pos').data.filter((b) => b.lat != null && (isAll() || b.year === sel));
    const grouped = d3.groups(rows, (b) => b.lat + ',' + b.lon).map(([key, bs]) => ({ bs, lat: bs[0].lat, lon: bs[0].lon, last: d3.max(bs, (b) => Number(b.year)) }));
    const col = (y) => (y >= 2016 ? '#3f3f8f' : y >= 2007 ? '#7b7bc4' : '#bcbce6');
    const t = tip(el);
    svg.append('g').selectAll('circle').data(grouped.sort((a, b) => a.last - b.last)).join('circle')
      .attr('cx', (d) => px(d.lon)).attr('cy', (d) => py(d.lat)).attr('r', (d) => 3.5 + Math.sqrt(d.bs.length) * 1.8)
      .attr('fill', (d) => col(d.last)).attr('stroke', '#fff').attr('stroke-width', 1)
      .on('mousemove', (ev, d) => showTip(el, t, ev, [`${d.bs[0].township ?? ''}`, `${d.bs.length} WNV+ bird${d.bs.length === 1 ? '' : 's'}`, ...d.bs.slice(0, 6).map((b) => `${F.dateY(b.date)} · ${b.species}`), d.bs.length > 6 ? `+${d.bs.length - 6} more` : '']))
      .on('mouseleave', () => { t.hidden = true; });

  const wk = () => Number(dash.params().wk ?? 30);

  const inSeason = (r) => isAll() || r.year === season();

  dash.draw('wk-map-county', (el) => { if (!ready(el, ...IDS)) return; drawMap(el, { box: COUNTY, pos: wkPos(), ghost: ghost(), colorBy: 'year', showZoomBox: true }); });
  dash.draw('wk-map-zoom', (el) => { if (!ready(el, ...IDS)) return; drawMap(el, { box: ZOOM, pos: wkPos(), ghost: ghost(), colorBy: 'year' }); });
  dash.draw('wk', (el) => { el.textContent = String(wk()); });
  dash.draw('wk-dates', (el) => {

  });
  const wkVal = (name, field) => dash.draw(name, (el) => {
    const g = dash.data('weekly');
    el.setAttribute('data-where', `year=${encodeURIComponent(season())}&week=${wk()}`);
    const row = g.status === 'ok' ? g.data.find((r) => r.year === season() && r.week === wk()) : null;
    el.textContent = row ? F.int(row[field]) : '—';
  });
  wkVal('wk-pos', 'wnv_pos'); wkVal('wk-cum', 'cum_pos');
  dash.draw('year-legend', (el) => {
    el.replaceChildren(...YEARS.filter((y) => isAll() || y === season()).map((y) => { const s = document.createElement('span'); const i = document.createElement('i'); i.style.background = yearColor(Number(y)); i.style.border = '1px solid var(--color-fg)'; s.append(i, document.createTextNode(y)); return s; }));
  });

    if (!ready(el, 'weekly')) return;
    const rows = dash.data('weekly').data.filter((r) => r.year === season() && r.week >= 21 && r.week <= 39);
    const W = el.clientWidth, H = 110, m = { t: 14, r: 4, b: 22, l: 4 };
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('height', H);

      .attr('fill', (r) => (r.week === cur ? '#f03b20' : r.week < cur && keep() ? '#c994c7' : 'var(--cds-chart-muted)')).style('cursor', 'pointer')
      .on('click', (ev, r) => dash.setParams({ wk: r.week }));
    svg.append('g').attr('pointer-events', 'none').selectAll('text.v').data(rows).join('text').attr('x', (r) => x(r.week) + x.bandwidth() / 2).attr('y', (r) => y(r.wnv_pos) - 3).attr('text-anchor', 'middle')
      .style('font-size', '10px').attr('fill', 'var(--color-fg-muted)').text((r) => (r.wnv_pos ? r.wnv_pos : ''));
    svg.append('g').attr('pointer-events', 'none').selectAll('text.w').data(rows).join('text').attr('x', (r) => x(r.week) + x.bandwidth() / 2).attr('y', H - 6).attr('text-anchor', 'middle')
      .style('font-size', '10px').style('font-weight', (r) => (r.week === cur ? 700 : 400)).attr('fill', (r) => (r.week === cur ? 'var(--color-fg)' : 'var(--color-fg-muted)')).text((r) => r.week);
  });

  // player controls
  let timer = null;
  const setWk = (w) => dash.setParams({ wk: Math.max(21, Math.min(39, w)) });
  const stop = () => { clearInterval(timer); timer = null; document.querySelectorAll('.bw-play').forEach((b) => { b.hidden = false; }); document.querySelectorAll('.bw-pause').forEach((b) => { b.hidden = true; }); };
  document.querySelectorAll('.bw-prev').forEach((b) => b.addEventListener('click', () => { stop(); setWk(wk() - 1); }));
  document.querySelectorAll('.bw-next').forEach((b) => b.addEventListener('click', () => { stop(); setWk(wk() + 1); }));
  document.querySelectorAll('.bw-pause').forEach((b) => b.addEventListener('click', stop));
  document.querySelectorAll('.bw-play').forEach((b) => b.addEventListener('click', () => {
    if (wk() >= 39) setWk(21);
    document.querySelectorAll('.bw-play').forEach((x) => { x.hidden = true; }); document.querySelectorAll('.bw-pause').forEach((x) => { x.hidden = false; });
    timer = setInterval(() => { if (wk() >= 39) stop(); else setWk(wk() + 1); }, 1400);
  }));
  document.querySelectorAll('.bw-week').forEach((r) => r.addEventListener('input', () => { stop(); setWk(Number(r.value)); }));
  document.querySelectorAll('.bw-keep').forEach((c) => c.addEventListener('change', () => dash.setParams({ keep: c.checked })));
  dash.onData(() => {
    document.querySelectorAll('.bw-week').forEach((r) => { r.value = String(wk()); });
    document.querySelectorAll('.bw-keep').forEach((c) => { c.checked = keep(); });
  });
})();

    const rainW = 70, vw = textW(svg, '00.0') + 10;
    const x = d3.scaleLinear([0, d3.max(rows, (r) => r.per_night)], [lw, W - rainW - vw]);
    const y = d3.scaleBand(rows.map((r) => r.site), [22, H - 4]).padding(0.22);
    const rc = d3.scaleLinear(d3.extent(rows, (r) => r.rain_in), ['#c6dbef', '#2171b5']);
    svg.append('text').attr('x', lw).attr('y', 12).style('font-size', 'var(--cds-font-size-caption)').attr('fill', 'var(--color-fg-muted)').text('Females per trap night');

    svg.append('g').selectAll('rect').data(segs).join('rect').attr('x', (s) => x(s.a)).attr('width', (s) => Math.max(0, x(s.b) - x(s.a))).attr('y', (s) => y(s.r.site)).attr('height', y.bandwidth()).attr('fill', (s) => s.c);
    svg.append('g').selectAll('text.v').data(rows).join('text').attr('x', (r) => x(r.per_night) + 6).attr('y', (r) => y(r.site) + y.bandwidth() / 2).attr('dy', '0.35em').style('font-size', 'var(--cds-font-size-caption)').attr('fill', 'var(--color-fg-muted)').text((r) => r.per_night.toFixed(1));
    svg.append('g').selectAll('rect.rain').data(rows).join('rect').attr('x', W - rainW + 6).attr('width', rainW - 12).attr('y', (r) => y(r.site)).attr('height', y.bandwidth()).attr('rx', 3).attr('fill', (r) => rc(r.rain_in));
    svg.append('g').selectAll('text.rain').data(rows).join('text').attr('x', W - rainW / 2).attr('y', (r) => y(r.site) + y.bandwidth() / 2).attr('dy', '0.35em').attr('text-anchor', 'middle').style('font-size', 'var(--cds-font-size-caption)').attr('fill', (r) => (rc(r.rain_in) && r.rain_in > 13 ? '#fff' : '#08306b')).text((r) => r.rain_in.toFixed(2) + '"');
    const tp = tip(el);
    svg.append('g').selectAll('rect.h').data(rows).join('rect').attr('x', 0).attr('width', W).attr('y', (r) => y(r.site)).attr('height', y.bandwidth()).attr('fill', 'transparent')
      .on('mousemove', (ev, r) => showTip(el, tp, ev, [r.site, `${F.int(r.females)} females in ${r.collections} collections (${r.trap_nights} trap nights)`, `Floodwater Aedes ${F.int(r.floodwater_aedes)} · Culex ${F.int(r.culex)} · Anopheles ${F.int(r.anopheles)}`, `Season rain ${r.rain_in.toFixed(2)}"`]))
      .on('mouseleave', () => { tp.hidden = true; });
  });

  dash.draw('twp26-table', (tb) => {
    const g = dash.data('trap26_townships');
    if (g.status !== 'ok') { tb.replaceChildren(); return; }
    const rows = [...g.data].sort((a, b) => a.township.localeCompare(b.township) || a.trap.localeCompare(b.trap));
    tb.replaceChildren(...rows.map((r) => { const tr = document.createElement('tr'); tr.dataset.key = encodeURIComponent(r.trap) + ',' + encodeURIComponent(r.township);
      [[r.township], [r.trap], [F.int(r.sessions)], [F.int(r.sites), 'hide-sm'], [F.int(r.mosquitoes)], [r.per_session.toFixed(1)], [F.int(r.culex)]].forEach(([v, c]) => { const td = document.createElement('td'); if (c) td.className = c; td.textContent = v; tr.append(td); }); return tr; }));
  });

  dash.draw('birds-table', (tb) => {
    const g = dash.data('birds26');
    if (g.status !== 'ok') { tb.replaceChildren(); return; }
    tb.replaceChildren(...g.data.map((b) => { const tr = document.createElement('tr'); if (b.wnv === 'Positive') tr.className = 'sel';
      [[String(b.call)], [b.date ? F.date(b.date) : 'No date'], [b.bird_type], [b.township ?? '', 'hide-sm'], [b.wnv], [b.eee, 'hide-sm']].forEach(([v, c]) => { const td = document.createElement('td'); if (c) td.className = c; td.textContent = v; tr.append(td); }); return tr; }));
  });
})();

<script>
(async function(){
 const ids=["arbo_testing","birds26","birds_pos","county_geo","eee_positives","history_annual","lighttrap_hist","positives","rain26_monthly","rain26_weekly","rain_local","rain_ncei","seasons","sites","species","species_shift","species_shift_summary","townships","townships_geo","trap26_sites","trap26_species","trap26_townships","trap26_weekly","traps","weather","weekly"];
 const DS={};
 const RAW=JSON.parse(document.getElementById('dash-data').textContent); for(const id of ids){const r=RAW[id]; r.columns=r.length?Object.keys(r[0]):[]; DS[id]=r;}
 const calcs={}, calcVals={}, draws=[], onDatas=[]; let params={};
 const dash={
  colors:['#2a6f97','#d1495b','#edae49','#00798c','#66a182','#8d6a9f','#c17c74','#4d5061'],
  data(id){ if(DS[id]) return {status:'ok',data:DS[id],message:null,refreshing:false,meta:{}};
    if(calcs[id]){ if(!(id in calcVals)){ const c=calcs[id]; calcVals[id]=c.fn(...c.inputs.map(i=>dash.data(i).data)); } return {status:'ok',data:calcVals[id],refreshing:false,meta:{}}; }
    return {status:'missing',data:[],message:'missing'}; },
  calc(id,o){calcs[id]=o;}, loader(){},
  onData(fn){onDatas.push(fn);},
  draw(name,fn){ if(fn===undefined){run();return;} draws.push([name,fn]); },
  params(){return {...params};},
  setParams(p){for(const k in p){ if(p[k]==null) delete params[k]; else params[k]=p[k]; } run();},
  resetParams(){params={};run();},
  setLink(){}, refresh(){}
 };
 window.dash=dash;
 const made=new WeakMap();
 function run(){
  onDatas.forEach(f=>{try{f()}catch(e){console.error(e)}});
  for(const [name,fn] of draws){
   document.querySelectorAll('[data-draw="'+name+'"]').forEach(el=>{
     if(el.closest('[hidden]')) return;
     try{ if(typeof fn==='function') fn(el); else { if(!made.has(el)){ el.replaceChildren(); made.set(el,{v:fn.mount?fn.mount(el):undefined}); } fn.update&&fn.update(el,made.get(el).v); } }catch(e){console.error(name,e)}
   });
  }
 }
 window.__run=run;
 const html=document.getElementById('dash-page').textContent.split('<'+'\\/').join('</');
 const root=document.getElementById('dash-root');

 const scripts=[...tpl.querySelectorAll('script')]; scripts.forEach(s=>s.remove());
 while(tpl.firstChild) root.appendChild(tpl.firstChild);
 for(const s of scripts){ try{ (new Function(s.textContent))(); }catch(e){console.error('script',e)} }
 // hidden toggles: rerun after attribute changes
 new MutationObserver(()=>{clearTimeout(window.__t);window.__t=setTimeout(run,0);}).observe(root,{attributes:true,attributeFilter:['hidden'],subtree:true});
 let lw=innerWidth; addEventListener('resize',()=>{if(innerWidth!==lw){lw=innerWidth;run();}});
 run(); window.__ready=true;
})();
